<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#080b10; --panel:#111722; --panel2:#18202d; --line:#243040;
    --txt:#eff3f9; --dim:#8492a6; --acc:#39d29b; --acc2:#4f9fff;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{display:block;touch-action:none;}
  #view{position:fixed;inset:0;}

  #top{position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(var(--sat) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,rgba(8,11,16,.95),rgba(8,11,16,0));}
  #brand{font-size:16px;font-weight:800;flex:1;}
  #brand span{color:var(--acc);}
  #brand small{display:block;font-size:10px;font-weight:400;color:var(--dim);}
  #hud{font-size:9.5px;color:#4a5768;direction:ltr;text-align:left;line-height:1.4;}
  .ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:rgba(17,23,34,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--txt);display:grid;place-items:center;font-size:16px;padding:0;cursor:pointer;}
  .ib.on{background:var(--acc);color:#03130c;border-color:var(--acc);}
  .ib:active{transform:scale(.93);}

  #searchWrap{position:fixed;left:10px;right:10px;top:calc(var(--sat) + 54px);z-index:30;display:none;}
  #searchWrap.show{display:block;}
  #qbox{display:flex;align-items:center;gap:9px;padding:12px 15px;border-radius:14px;
    border:1px solid var(--line);background:rgba(17,23,34,.97);backdrop-filter:blur(18px);}
  #q{flex:1;background:none;border:0;outline:none;color:var(--txt);font-size:15px;font-family:inherit;}
  #q::placeholder{color:#556;}
  #results{max-height:52vh;overflow-y:auto;margin-top:7px;border-radius:14px;
    background:rgba(17,23,34,.98);border:1px solid var(--line);-webkit-overflow-scrolling:touch;}
  .res{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;
    display:flex;justify-content:space-between;gap:8px;font-size:12.5px;}
  .res:active{background:rgba(57,210,155,.13);}
  .res .en{font-size:9.5px;color:var(--dim);direction:ltr;text-align:right;margin-top:2px;}
  .res .tag{font-size:9px;color:#03130c;background:var(--acc);padding:3px 7px;border-radius:6px;flex:0 0 auto;font-weight:700;}
  .empty{padding:16px;text-align:center;color:var(--dim);font-size:12px;}

  #card{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 132px);z-index:26;
    background:rgba(17,23,34,.97);backdrop-filter:blur(20px);border:1px solid var(--line);
    border-radius:16px;padding:13px 15px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6);}
  #card.show{display:block;animation:rise .2s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  #cTop{display:flex;gap:9px;align-items:flex-start;}
  #cName{font-size:14.5px;font-weight:800;flex:1;line-height:1.35;}
  #cTag{font-size:9px;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--dim);flex:0 0 auto;}
  #cActs{display:flex;gap:8px;margin-top:11px;}
  #cActs button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    border-radius:11px;padding:9px;font-size:11.5px;font-family:inherit;cursor:pointer;}
  #cActs button.primary{background:var(--acc);color:#03130c;border-color:var(--acc);font-weight:700;}

  #dock{position:fixed;left:0;right:0;bottom:0;z-index:22;
    background:rgba(14,19,27,.97);backdrop-filter:blur(22px);border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:8px 12px calc(var(--sab) + 10px);
    transition:transform .28s cubic-bezier(.32,.9,.32,1);}
  #dock.down{transform:translateY(calc(100% - 42px));}
  #dockTop{display:flex;align-items:center;gap:8px;padding-bottom:6px;}
  #grab{width:32px;height:4px;border-radius:3px;background:#31404f;flex:0 0 auto;cursor:pointer;}
  #dockLabel{font-size:10.5px;color:var(--dim);flex:1;}
  #sysRow{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
  #sysRow::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:#9aa8bb;
    border-radius:11px;padding:8px 12px;font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--acc);color:#03130c;border-color:var(--acc);font-weight:700;}
  #tools{display:flex;gap:6px;}
  .tbtn{flex:1;border:1px solid var(--line);background:var(--panel2);color:#aab6c6;
    border-radius:11px;padding:8px 3px;font-size:10px;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;}
  .tbtn .g{font-size:14px;line-height:1;}
  .tbtn.on{background:var(--acc);color:#03130c;border-color:var(--acc);font-weight:700;}

  #gate{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,#101a26,#080b10 72%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:26px;text-align:center;}
  #gate.out{opacity:0;pointer-events:none;transition:opacity .45s;}
  #gate h1{margin:0;font-size:33px;font-weight:800;letter-spacing:-1px;}
  #gate h1 span{color:var(--acc);}
  #gate .sub{margin:0;color:var(--dim);font-size:13px;line-height:1.75;max-width:300px;}
  #stats{display:flex;gap:20px;margin:6px 0 2px;}
  #stats div{text-align:center;}
  #stats b{display:block;font-size:18px;color:var(--acc);font-weight:800;}
  #stats small{font-size:9px;color:var(--dim);}
  #prog{width:min(280px,80vw);height:4px;background:#1a2432;border-radius:3px;overflow:hidden;}
  #progBar{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
    border-radius:3px;transition:width .3s;}
  #progTxt{font-size:11px;color:var(--dim);min-height:15px;max-width:300px;}
  #go{background:var(--acc);color:#03130c;border:0;border-radius:999px;padding:15px 46px;
    font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;}
  #go:disabled{opacity:.4;}
  #cred{position:absolute;bottom:calc(var(--sab) + 12px);left:18px;right:18px;
    font-size:9px;color:#39465a;line-height:1.5;}

  #badge{position:fixed;top:calc(var(--sat) + 54px);left:50%;transform:translateX(-50%);
    z-index:32;background:rgba(17,23,34,.96);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:10.5px;color:var(--acc);display:none;align-items:center;
    gap:7px;max-width:88vw;white-space:nowrap;}
  #badge.show{display:flex;}
  .spin{width:11px;height:11px;border:2px solid rgba(57,210,155,.25);border-top-color:var(--acc);
    border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';

/* ═══ الإعداد ═══ */
const MANIFEST_URL = "manifest.json";
const MODEL_BASE = "https://github.com/mhmdalhsry786-alt/atlas-real/releases/download/models-v1/";   // النماذج على GitHub Releases
const S = {
  renderer:null, scene:null, camera:null,
  groups:[],        // [{file, count, ...}]
  loaded:{},        // file → {root, meshes[]}
  names:{},         // file → [أسماء]
  index:[],         // بحث
  visible:{}, selected:null, isolated:null,
  spin:false, xray:false, ready:false,
  ptr:new THREE.Vector2(), ray:new THREE.Raycaster()
};
const CAM = {theta:0, phi:Math.PI/2, dist:1500, tTheta:0, tPhi:Math.PI/2, tDist:1500,
             target:new THREE.Vector3()};
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ═══ المشهد ═══ */
function initScene(){
  const r = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  r.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  r.setSize(innerWidth, innerHeight);
  r.outputColorSpace = THREE.SRGBColorSpace;
  $("#view").appendChild(r.domElement);
  S.renderer = r;

  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x080b10);
  S.scene = sc;

  S.camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 20000);

  sc.add(new THREE.HemisphereLight(0xd0e2ff, 0x0e1620, 1.3));
  const k1=new THREE.DirectionalLight(0xffffff,2.2); k1.position.set(600,900,1300);
  const k2=new THREE.DirectionalLight(0xa8c8ff,0.95); k2.position.set(-900,250,600);
  const k3=new THREE.DirectionalLight(0x39d29b,0.5);  k3.position.set(0,-700,-1000);
  sc.add(k1,k2,k3);

  bindCam(r.domElement);
  addEventListener("resize",()=>{
    S.camera.aspect=innerWidth/innerHeight; S.camera.updateProjectionMatrix();
    r.setSize(innerWidth,innerHeight);
  });
  loop();
}

function bindCam(dom){
  let drag=false,lx=0,ly=0,dx=0,dy=0,dt=0;
  dom.addEventListener("pointerdown",e=>{
    drag=true;lx=e.clientX;ly=e.clientY;dx=e.clientX;dy=e.clientY;dt=performance.now();
    try{dom.setPointerCapture(e.pointerId);}catch(_){}
  });
  dom.addEventListener("pointermove",e=>{
    if(!drag)return;
    CAM.tTheta-=(e.clientX-lx)*0.0056;
    CAM.tPhi=clamp(CAM.tPhi-(e.clientY-ly)*0.0056,0.12,Math.PI-0.12);
    lx=e.clientX;ly=e.clientY;
  });
  dom.addEventListener("pointerup",e=>{
    if(!drag)return;drag=false;
    if(Math.hypot(e.clientX-dx,e.clientY-dy)<10 && performance.now()-dt<350) pick(e.clientX,e.clientY);
  });
  dom.addEventListener("wheel",e=>{
    e.preventDefault();
    CAM.tDist=clamp(CAM.tDist*(1+Math.sign(e.deltaY)*0.13),0.05,8000);
  },{passive:false});
  let pinch=null;
  dom.addEventListener("touchstart",e=>{
    if(e.touches.length===2) pinch=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  },{passive:true});
  dom.addEventListener("touchmove",e=>{
    if(e.touches.length===2&&pinch){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                         e.touches[0].clientY-e.touches[1].clientY);
      CAM.tDist=clamp(CAM.tDist*(pinch/d),0.05,8000); pinch=d;
    }
  },{passive:true});
  dom.addEventListener("touchend",()=>{pinch=null;});
}

function loop(){
  requestAnimationFrame(loop);
  CAM.theta+=(CAM.tTheta-CAM.theta)*0.15;
  CAM.phi  +=(CAM.tPhi  -CAM.phi  )*0.15;
  CAM.dist +=(CAM.tDist -CAM.dist )*0.15;
  if(S.spin) CAM.tTheta+=0.0055;
  const s=Math.sin(CAM.phi);
  S.camera.position.set(
    CAM.target.x+CAM.dist*s*Math.sin(CAM.theta),
    CAM.target.y+CAM.dist*Math.cos(CAM.phi),
    CAM.target.z+CAM.dist*s*Math.cos(CAM.theta));
  S.camera.lookAt(CAM.target);
  S.renderer.render(S.scene,S.camera);
}

/* ═══ التحميل ═══ */
async function boot(){
  initScene();
  bindUI();

  let man = {groups:[], names:{}};
  try{
    const r = await fetch(MANIFEST_URL);
    if(r.ok) man = await r.json();
  }catch(_){}

  S.groups = man.groups || [];
  S.names = man.names || {};
  $("#sG").textContent = S.groups.length;

  const draco = new DRACOLoader();
  draco.setDecoderPath("./vendor/draco/");
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);

  const bar=$("#progBar"), txt=$("#progTxt"), badge=$("#badge");
  const N = S.groups.length || 1;
  let done=0, totalMeshes=0, loadedGroups=0;

  for(const g of S.groups){
    const label = `يُحمّل ${g.name || g.file}…`;
    txt.textContent = label; badge.classList.add("show"); $("#badgeTxt").textContent = label;
    try{
      const url = MODEL_BASE + g.file.split("/").pop();
      const gltf = await loader.loadAsync(url, ev=>{
        if(ev.lengthComputable)
          bar.style.width = (((done + ev.loaded/ev.total)/N)*100).toFixed(1)+"%";
      });
      const meshes=[];
      const names = S.names[g.name] || S.names[g.file] || [];
      let i=0;
      gltf.scene.traverse(o=>{
        if(!o.isMesh) return;
        o.userData.group = g.name || g.file;
        o.userData.en = (names[i] || o.name || `جزء ${i}`).replace(/_/g," ").trim();
        i++;
        if(o.material){
          o.material.side = THREE.DoubleSide;
          o.material.roughness = 0.62;
          o.material.metalness = 0.04;
          o.material.transparent = true;
          o.material.opacity = 1;
        }
        meshes.push(o);
      });
      S.scene.add(gltf.scene);
      S.loaded[g.name || g.file] = {root:gltf.scene, meshes};
      S.visible[g.name || g.file] = true;
      totalMeshes += meshes.length;
      loadedGroups++;
    }catch(e){
      console.warn("fail", g.file, e && e.message);
    }
    done++;
    bar.style.width=(done/N*100).toFixed(1)+"%";
    txt.textContent = `${done}/${N} — ${totalMeshes.toLocaleString("en-US")} نموذجًا`;
    await new Promise(r=>setTimeout(r,8));
  }

  badge.classList.remove("show");
  buildChips();
  buildIndex();
  fit();
  $("#sN").textContent = totalMeshes.toLocaleString("en-US");
  $("#progTxt").textContent = totalMeshes ? "جاهز" : "تعذّر تحميل المجموعات";
  $("#go").disabled = false;
  S.ready = true;
}

/* ═══ واجهة المجموعات ═══ */
function buildChips(){
  const row = $("#sysRow");
  row.innerHTML = "";
  for(const id in S.loaded){
    const b=document.createElement("button");
    b.className="chip on"; b.dataset.id=id;
    b.textContent = id.replace("sharedassets","مجموعة ");
    b.onclick=()=>{
      S.visible[id]=!S.visible[id];
      b.classList.toggle("on",S.visible[id]);
      for(const m of S.loaded[id].meshes) m.visible=S.visible[id];
    };
    row.appendChild(b);
  }
}

/* ═══ بحث ═══ */
function buildIndex(){
  S.index.length=0;
  for(const id in S.loaded){
    for(const m of S.loaded[id].meshes){
      const en=m.userData.en; if(!en||en.length<2) continue;
      S.index.push({en, group:id, mesh:m, low:en.toLowerCase()});
    }
  }
}
function search(q){
  q=(q||"").trim().toLowerCase();
  if(q.length<2) return [];
  const out=[];
  for(const it of S.index){
    if(it.low.includes(q)){ out.push(it); if(out.length>=80) break; }
  }
  return out;
}

/* ═══ اختيار ═══ */
function pick(cx,cy){
  if(!S.ready)return;
  const r=S.renderer.domElement.getBoundingClientRect();
  S.ptr.x=((cx-r.left)/r.width)*2-1;
  S.ptr.y=-((cy-r.top)/r.height)*2+1;
  S.ray.setFromCamera(S.ptr,S.camera);
  const targets=[];
  for(const id in S.loaded){ if(!S.visible[id])continue;
    for(const m of S.loaded[id].meshes) if(m.visible) targets.push(m); }
  const hit=S.ray.intersectObjects(targets,false);
  if(!hit.length){ deselect(); return; }
  select(hit[0].object);
}
function select(mesh){
  deselect(true);
  S.selected=mesh;
  if(mesh.material && mesh.material.emissive && !S.xray){
    mesh.userData._em=mesh.material.emissive.getHex();
    mesh.material.emissive.setHex(0x1a5c40);
  }
  const box=new THREE.Box3().setFromObject(mesh);
  CAM.target.copy(box.getCenter(new THREE.Vector3()));
  $("#cName").textContent = mesh.userData.en;
  $("#cTag").textContent = (mesh.userData.group||"").replace("sharedassets","مجموعة ");
  $("#card").classList.add("show");
  $("#cIso").onclick=()=>isolate(mesh);
  $("#cClose").onclick=()=>{deselect();unisolate();};
}
function deselect(keep){
  if(S.selected&&S.selected.material&&S.selected.material.emissive&&S.selected.userData._em!=null){
    S.selected.material.emissive.setHex(S.selected.userData._em);
    S.selected.userData._em=null;
  }
  S.selected=null;
  if(!keep) $("#card").classList.remove("show");
}
function isolate(mesh){
  for(const id in S.loaded) for(const m of S.loaded[id].meshes) m.visible=(m===mesh);
  mesh.visible=true;
  const b=new THREE.Box3().setFromObject(mesh);
  const s=b.getSize(new THREE.Vector3());
  CAM.target.copy(b.getCenter(new THREE.Vector3()));
  CAM.tDist=Math.max(s.x,s.y,s.z)*2.8;
  S.isolated=mesh;
  $("#card").classList.remove("show");
}
function unisolate(){
  if(!S.isolated)return;
  for(const id in S.loaded){
    const v=S.visible[id];
    for(const m of S.loaded[id].meshes) m.visible=v;
  }
  S.isolated=null; fit();
}
function fit(){
  S.scene.updateMatrixWorld(true);
  const box=new THREE.Box3();
  for(const id in S.loaded) if(S.visible[id]) box.expandByObject(S.loaded[id].root);
  if(box.isEmpty())return;
  const size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  if(maxDim>0){
    S.camera.near=maxDim/600; S.camera.far=maxDim*80; S.camera.updateProjectionMatrix();
  }
  const fov=S.camera.fov*Math.PI/180, aspect=S.camera.aspect||1;
  const dH=(size.y/2)/Math.tan(fov/2);
  const dW=(Math.max(size.x,size.z)/2)/(Math.tan(fov/2)*aspect);
  const visH=Math.max(0.5,(innerHeight-200)/innerHeight);
  CAM.target.copy(ctr);
  CAM.tDist=CAM.dist=Math.max(dH,dW)/visH*0.98;
  CAM.tTheta=CAM.theta=0; CAM.tPhi=CAM.phi=Math.PI/2;
  $("#hud").innerHTML=`${size.y.toFixed(2)}u<br>${Math.round(CAM.dist)}`;
}

/* ═══ الواجهة ═══ */
function bindUI(){
  const wrap=$("#searchWrap"), q=$("#q");
  $("#btnSearch").onclick=()=>{
    wrap.classList.toggle("show");
    if(wrap.classList.contains("show")) setTimeout(()=>q.focus(),80);
  };
  $("#qClose").onclick=()=>{wrap.classList.remove("show");q.blur();};
  q.addEventListener("input",()=>{
    const box=$("#results"); const res=search(q.value);
    box.innerHTML="";
    if(!q.value.trim())return;
    if(!res.length){box.innerHTML='<div class="empty">لا نتائج</div>';return;}
    for(const it of res.slice(0,50)){
      const d=document.createElement("div"); d.className="res";
      d.innerHTML=`<div>${it.en}<div class="en">${it.group.replace("sharedassets","group ")}</div></div>`;
      d.onclick=()=>{
        wrap.classList.remove("show");q.blur();
        if(!S.visible[it.group]){
          S.visible[it.group]=true;
          const c=document.querySelector(`.chip[data-id="${it.group}"]`);
          if(c)c.classList.add("on");
          for(const m of S.loaded[it.group].meshes) m.visible=true;
        }
        unisolate(); select(it.mesh);
      };
      box.appendChild(d);
    }
  });

  const tSpin=$("#tSpin");
  tSpin.onclick=()=>{S.spin=!S.spin;tSpin.classList.toggle("on",S.spin);};
  const tX=$("#tXray");
  tX.onclick=()=>{
    S.xray=!S.xray; tX.classList.toggle("on",S.xray);
    for(const id in S.loaded) for(const m of S.loaded[id].meshes){
      if(!m.material)continue;
      m.material.opacity=S.xray?0.34:1;
      m.material.transparent=true;
      m.material.depthWrite=!S.xray;
    }
  };
  $("#tReset").onclick=()=>{deselect();unisolate();fit();};
  const tHide=$("#tHide"),dock=$("#dock");
  const tg=()=>{dock.classList.toggle("down");
    tHide.querySelector(".g").textContent=dock.classList.contains("down")?"▴":"▾";};
  tHide.onclick=tg; $("#grab").onclick=tg;
  $("#btnReset").onclick=()=>{deselect();unisolate();fit();};
  $("#go").onclick=()=>{
    registerSW();
    const g=$("#gate"); g.classList.add("out");
    setTimeout(()=>g.style.display="none",460);
  };
  addEventListener("keydown",e=>{if(e.key==="Escape"){wrap.classList.remove("show");deselect();unisolate();}});
}

/* ═══ بلا إنترنت ═══ */
async function registerSW(){
  if(!("serviceWorker" in navigator))return;
  if(location.protocol!=="https:" && !["localhost","127.0.0.1"].includes(location.hostname))return;
  try{
    await navigator.serviceWorker.register("sw.js",{scope:"./"});
    await navigator.serviceWorker.ready;
  }catch(_){}
}

window.__S=S; window.__T=THREE; window.__CAM=CAM;
boot();
</script>
