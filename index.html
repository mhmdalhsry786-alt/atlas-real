<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>أطلس التشريح — 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e14; --panel:#131a24; --panel2:#1b2532; --line:#243040;
  --txt:#e8eef6; --dim:#8b9bb0; --acc:#ff9f43; --acc2:#4aa8ff; --ok:#38d39f; --bad:#ff5c6c;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,sans-serif;
  -webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ── بوابة البدء ── */
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#0a0e14,#111c2a 60%,#0a0e14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center}
#gate .logo{width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,var(--acc),#ff6b35);
  display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 12px 40px rgba(255,159,67,.3)}
#gate h1{font-size:25px;font-weight:800;letter-spacing:-.5px}
#gate .sub{font-size:13px;color:var(--dim);line-height:1.7}
#progBar{height:5px;background:var(--line);border-radius:3px;width:230px;overflow:hidden}
#progBar{position:relative}
#progBar::after{content:"";position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#progTxt{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
#go{padding:15px 44px;border:none;border-radius:15px;background:linear-gradient(135deg,var(--acc),#ff6b35);
  color:#101418;font-size:16.5px;font-weight:800;font-family:inherit;opacity:1;transition:.2s}
#go:disabled{opacity:.3}
.stats{display:flex;gap:24px;font-size:11.5px;color:var(--dim)}
.stats b{display:block;font-size:19px;color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}

/* ── شريط علوي ── */
#top{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(env(safe-area-inset-top) + 9px) 11px 9px;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(10,14,20,.96),rgba(10,14,20,0));pointer-events:none}
#top>*{pointer-events:auto}
.tbtn{width:40px;height:40px;border-radius:12px;background:rgba(19,26,36,.92);border:1px solid var(--line);
  color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(14px)}
.tbtn.on{background:var(--acc);color:#101418;border-color:var(--acc)}
#title{flex:1;text-align:center;font-size:12.5px;color:var(--dim);font-weight:600}

/* ── شريط أدوات سفلي ── */
#tools{position:fixed;bottom:0;left:0;right:0;z-index:30;
  padding:9px 9px calc(env(safe-area-inset-bottom) + 9px);
  display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
  background:linear-gradient(0deg,rgba(10,14,20,.97),rgba(10,14,20,.6) 70%,transparent)}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px;border-radius:12px;
  background:rgba(19,26,36,.9);border:1px solid var(--line);color:var(--dim);font-size:9.5px;
  font-family:inherit;backdrop-filter:blur(14px);transition:.15s}
.tool i{font-size:17px;font-style:normal;line-height:1}
.tool.on{background:var(--acc);color:#101418;border-color:var(--acc)}
.tool:active{transform:scale(.94)}

/* ── بطاقة الجزء ── */
#partInfo{position:fixed;left:11px;right:11px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:35;
  background:rgba(19,26,36,.97);border:1px solid var(--line);border-radius:17px;padding:14px;
  backdrop-filter:blur(20px);transform:translateY(140%);transition:transform .3s cubic-bezier(.3,1.2,.5,1);
  box-shadow:0 -8px 34px rgba(0,0,0,.6);pointer-events:none;visibility:hidden}
#partInfo.show{transform:translateY(0);pointer-events:auto;visibility:visible}
#partAr{font-size:16px;font-weight:700;margin-bottom:2px}
#partEn{font-size:11px;color:var(--acc);direction:ltr;text-align:right;margin-bottom:8px}
#partGroup{font-size:10px;color:var(--dim)}
.pi-btns{display:flex;gap:7px;margin-top:11px}
.pi-btns button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);font-family:inherit;font-size:11.5px;font-weight:600}
.pi-btns button.on{background:var(--acc);color:#101418;border-color:var(--acc)}

/* ── أزرار دوران ── */
#rot{position:fixed;left:11px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:29;
  display:flex;flex-direction:column;gap:4px;transition:opacity .2s}
#rot button{width:34px;height:34px;border-radius:10px;background:rgba(19,26,36,.85);
  border:1px solid var(--line);color:var(--dim);font-size:13px;backdrop-filter:blur(10px)}

/* ── نوافذ منسدلة ── */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.8);backdrop-filter:blur(7px);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .24s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet-in{width:100%;max-height:83vh;background:var(--panel);border-radius:23px 23px 0 0;
  border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1.15,.5,1);overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.sheet.show .sheet-in{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 13px}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:0 18px 13px}
.sh-h h2{font-size:17px;font-weight:700}
.sh-h button{background:none;border:none;color:var(--dim);font-size:22px;line-height:1;font-family:inherit}

/* بحث */
#searchWrap{padding:0 16px 13px}
#q2{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);font-size:15px;font-family:inherit;outline:none}
#q2:focus{border-color:var(--acc)}
.res{padding:11px 16px;border-bottom:1px solid rgba(36,48,64,.5)}
.res:active{background:var(--panel2)}
.res-ar{font-size:14px;font-weight:600;margin-bottom:1px}
.res-en{font-size:10.5px;color:var(--dim);direction:ltr;text-align:right}
.res-empty{padding:30px;text-align:center;color:var(--dim);font-size:13px}
#results2{max-height:52vh;overflow-y:auto}

/* جولات */
#tourList{padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tour{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:15px 12px;
  display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center}
.tour:active{transform:scale(.96)}
.tour-ic{font-size:27px}
.tour-ar{font-size:13px;font-weight:700}
.tour-n{font-size:9.5px;color:var(--dim)}

/* شريط الجولة */
#tourBar{position:fixed;left:11px;right:11px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:45;
  background:rgba(19,26,36,.98);border:1px solid var(--acc);border-radius:17px;padding:13px;
  transform:translateY(160%);transition:transform .3s cubic-bezier(.3,1.2,.5,1);
  box-shadow:0 -8px 34px rgba(255,159,67,.15);pointer-events:none;visibility:hidden}
#tourBar.show{transform:translateY(0);pointer-events:auto;visibility:visible}
#tourFillWrap{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:10px}
#tourFill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#tourTxt{font-size:14px;font-weight:600;line-height:1.6;margin-bottom:9px}
.tb-row{display:flex;gap:7px;align-items:center}
#tourProg{font-size:11px;color:var(--dim);flex:1;font-variant-numeric:tabular-nums}
.tb-row button{padding:8px 15px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);font-family:inherit;font-size:11.5px;font-weight:600}
.tb-row button.pri{background:var(--acc);color:#101418;border-color:var(--acc)}

/* اختبار */
#quizIntro,#quizRes{padding:20px 22px}
.qi-ic{font-size:46px;text-align:center;margin-bottom:13px}
#quizIntro h3{font-size:18px;text-align:center;margin-bottom:7px}
#quizIntro p{font-size:12.5px;color:var(--dim);text-align:center;line-height:1.75;margin-bottom:19px}
.big-btn{width:100%;padding:14px;border-radius:13px;border:none;
  background:linear-gradient(135deg,var(--acc),#ff6b35);color:#101418;
  font-size:15.5px;font-weight:800;font-family:inherit}
#quizBox{padding:18px}
#quizMeta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:8px}
#quizFillWrap{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
#quizFill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
#quizQ{font-size:12px;color:var(--dim);margin-bottom:7px}
#quizTarget{font-size:23px;font-weight:800;margin-bottom:20px;line-height:1.35}
.qopt{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);
  color:var(--txt);font-family:inherit;font-size:13px;margin-bottom:7px;text-align:right;
  direction:ltr;transition:.15s}
.qopt.ok{background:rgba(56,211,159,.16);border-color:var(--ok);color:var(--ok)}
.qopt.bad{background:rgba(255,92,108,.16);border-color:var(--bad);color:var(--bad)}
.qr-num{font-size:56px;font-weight:800;text-align:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;line-height:1;margin-bottom:5px}
.qr-sub{text-align:center;font-size:13px;color:var(--dim);margin-bottom:20px}
.qr-list{margin-bottom:19px}
.qr-row{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid rgba(36,48,64,.5);font-size:12px}
.qr-row.ok span:first-child{color:var(--ok)}
.qr-row.bad span:first-child{color:var(--bad)}
.qr-t{direction:ltr;text-align:right;flex:1;color:var(--dim)}

/* أنظمة / مفضلة */
#sysList,#favList{padding:0 14px;max-height:56vh;overflow-y:auto}
.sysrow{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid rgba(36,48,64,.5)}
.sysrow input{width:19px;height:19px;accent-color:var(--acc)}
.sys-name{flex:1;font-size:13px}
.sys-n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.favrow{padding:12px 4px;border-bottom:1px solid rgba(36,48,64,.5)}
.fav-ar{font-size:13px;font-weight:600;display:block}
.fav-en{font-size:10px;color:var(--dim);direction:ltr;text-align:right}
.empty{padding:34px;text-align:center;color:var(--dim);font-size:12.5px}

.badge{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;
  background:rgba(19,26,36,.97);border:1px solid var(--line);border-radius:13px;padding:13px 22px;
  font-size:13px;color:var(--dim);opacity:0;pointer-events:none;transition:opacity .25s}
.badge.show{opacity:1}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<!-- بوابة -->
<div id="gate">
  <div class="logo">🫀</div>
  <h1>أطلس التشريح ثلاثي الأبعاد</h1>
  <div class="sub">20,320 نموذجًا أصليًا · يعمل بلا إنترنت</div>
  <div class="stats">
    <div><b id="sG">98</b>مجموعة</div>
    <div><b id="sN">0</b>جزء</div>
    <div><b id="sT">20,320</b>إجمالي</div>
  </div>
  <div id="progBar"></div>
  <div id="progTxt">يُجهّز…</div>
  <button id="go" disabled>ابدأ الاستكشاف</button>
</div>

<!-- شريط علوي -->
<div id="top">
  <button class="tbtn" id="searchBtn">🔍</button>
  <div id="title">أطلس التشريح</div>
  <button class="tbtn" id="sysBtn">☰</button>
</div>

<!-- أدوات -->
<div id="tools">
  <button class="tool" id="tourBtn"><i>🧭</i>جولات</button>
  <button class="tool" id="quizBtn"><i>📝</i>اختبار</button>
  <button class="tool" id="favOpen"><i>⭐</i>مفضلة</button>
  <button class="tool" id="animBtn"><i>🔄</i>دوران</button>
  <button class="tool" id="xrayBtn"><i>👁</i>شفافية</button>
  <button class="tool" id="resetBtn"><i>⌂</i>إعادة</button>
</div>

<!-- دوران -->
<div id="rot">
  <button id="rotU">▲</button>
  <button id="rotL">◀</button>
  <button id="rotR">▶</button>
  <button id="rotD">▼</button>
</div>

<!-- بطاقة الجزء -->
<div id="partInfo">
  <div id="partAr"></div>
  <div id="partEn"></div>
  <div id="partGroup"></div>
  <div class="pi-btns">
    <button id="isoBtn">عزل</button>
    <button id="favBtn">⭐ مفضلة</button>
  </div>
</div>

<!-- شريط الجولة -->
<div id="tourBar">
  <div id="tourFillWrap"><div id="tourFill"></div></div>
  <div id="tourTxt"></div>
  <div class="tb-row">
    <span id="tourProg"></span>
    <button id="tourEnd">إنهاء</button>
    <button class="pri" id="tourNext">التالي ›</button>
  </div>
</div>

<!-- نافذة البحث -->
<div class="sheet" id="searchSheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sh-h"><h2>ابحث عن عضو</h2><button data-close="searchSheet">✕</button></div>
    <div id="searchWrap"><input id="q2" placeholder="مثال: قلب، عصب، فقرة…" autocomplete="off"></div>
    <div id="results2"></div>
  </div>
</div>

<!-- نافذة الجولات -->
<div class="sheet" id="tourSheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sh-h"><h2>الجولات التشريحية</h2><button data-close="tourSheet">✕</button></div>
    <div id="tourList"></div>
  </div>
</div>

<!-- نافذة الاختبار -->
<div class="sheet" id="quizSheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <div id="quizIntro">
      <div class="qi-ic">📝</div>
      <h3>اختبر معرفتك التشريحية</h3>
      <p>8 أسئلة · يتغيّر كل مرة<br>اختر الاسم العلمي الصحيح للجزء</p>
      <button class="big-btn" id="quizStart">ابدأ الاختبار</button>
    </div>
    <div id="quizBox" style="display:none">
      <div id="quizMeta"><span id="quizN">1 / 8</span><span>اختر الإجابة</span></div>
      <div id="quizFillWrap"><div id="quizFill"></div></div>
      <div id="quizQ"></div>
      <div id="quizTarget"></div>
      <div id="quizOpts"></div>
    </div>
    <div id="quizRes" style="display:none">
      <div class="qr-num"></div>
      <div class="qr-sub"></div>
      <div class="qr-list"></div>
      <button class="big-btn" id="quizAgain">أعد الاختبار</button>
      <button class="big-btn" id="quizClose" style="margin-top:8px;background:var(--panel2);color:var(--txt)">إغلاق</button>
    </div>
  </div>
</div>

<!-- نافذة الأنظمة -->
<div class="sheet" id="sysSheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sh-h"><h2>المجموعات</h2><button data-close="sysSheet">✕</button></div>
    <div id="sysList"></div>
  </div>
</div>

<!-- نافذة المفضلة -->
<div class="sheet" id="favSheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sh-h"><h2>المفضلة</h2><button data-close="favSheet">✕</button></div>
    <div id="favList"></div>
  </div>
</div>

<div class="badge" id="badge"><span id="badgeTxt"></span></div>

<script type="module" src="./app_v2.js?v=506280"></script>
<script>
if("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
